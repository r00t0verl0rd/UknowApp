services:
  telegram-bot-api:
    image: ${TELEGRAM_API_IMAGE:-aiogram/telegram-bot-api:latest}
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    volumes:
      - ${TELEGRAM_CACHE_HOST_DIR:-/srv/uknow-telegram}:/var/lib/telegram-bot-api
    ports:
      - "${TELEGRAM_LISTEN_IP:-127.0.0.1}:8081:8081"
    restart: unless-stopped
