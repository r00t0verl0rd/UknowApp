# Run on the connector VPS, not on the Core VPS.
services:
  tgbot:
    build:
      context: .
      dockerfile: connectors/telegram/Dockerfile
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set Telegram token}
      TELEGRAM_API_MODE: ${TELEGRAM_API_MODE:-cloud}
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-http://telegram-bot-api:8081}
      TELEGRAM_FILES_DIR: /var/lib/telegram-bot-api
      BOTS_GATEWAY_URL: ${BOTS_GATEWAY_URL:?set private Core URL}
      BOTS_GATEWAY_TELEGRAM_SECRET: ${BOTS_GATEWAY_TELEGRAM_SECRET:?set connector secret}
    volumes:
      - tgbot_state:/app/state
      - ${TELEGRAM_CACHE_HOST_DIR:-/srv/uknow-telegram}:/var/lib/telegram-bot-api:ro
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time; p=pathlib.Path('/app/state/healthy'); assert p.is_file() and time.time()-p.stat().st_mtime < 20"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
volumes:
  tgbot_state:
