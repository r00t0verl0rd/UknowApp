# Run on the connector VPS, not on the Core VPS.
services:
  tg_bot:
    build:
      context: .
      dockerfile: connectors/telegram/Dockerfile
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set Telegram token}
      TELEGRAM_API_MODE: ${TELEGRAM_API_MODE:-cloud}
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-http://telegram-bot-api:8081}
      TELEGRAM_FILES_DIR: /var/lib/telegram-bot-api
      BOTS_NATS_URL: ${BOTS_NATS_URL:?set private NATS URL}
      BOTS_NATS_USER: telegram
      BOTS_NATS_PASSWORD: ${BOTS_NATS_TELEGRAM_PASSWORD:?set connector password}
      BOTS_MEDIA_URL: ${BOTS_MEDIA_URL:?set private Core URL}
      BOTS_MEDIA_SECRET: ${BOTS_MEDIA_SECRET_TELEGRAM:?set media secret}
    volumes:
      - tgbot_state:/app/state
      - ${TELEGRAM_CACHE_HOST_DIR:-/srv/uknow-telegram}:/var/lib/telegram-bot-api:ro
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time; p=pathlib.Path('/app/state/healthy'); assert p.is_file() and time.time()-p.stat().st_mtime < 75"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
volumes:
  tgbot_state:
