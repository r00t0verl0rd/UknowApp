port: 4222
max_payload: 1048576
jetstream {
  store_dir: "/data"
  max_mem_store: 64MB
  max_file_store: 2GB
}
authorization {
  users: [
    { user: core, password: $CORE_PASSWORD },
    {
      user: telegram, password: $TELEGRAM_PASSWORD,
      permissions: {
        publish: { allow: [
          "uknow.v1.rpc.telegram.>",
          "uknow.v1.inbound.telegram",
          "uknow.v1.delivery.telegram",
          "$JS.API.CONSUMER.MSG.NEXT.UKNOW_BOTS_V1.outbound-telegram",
          "$JS.ACK.UKNOW_BOTS_V1.outbound-telegram.>"
        ] }
        subscribe: { allow: ["_INBOX.telegram.>", "uknow.v1.ui.telegram"] }
      }
    }
  ]
}
