name: Keep Android PWA PNG in sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/public/logo-big.png"
      - "frontend/scripts/generate_pwa_png.py"
      - ".github/workflows/generate-pwa-png.yml"

permissions:
  contents: write

jobs:
  icon-192:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate 192px PNG from the supplied 512px PNG
        run: |
          python -m pip install "Pillow>=10,<13"
          python frontend/scripts/generate_pwa_png.py
      - name: Commit resized icon to main
        run: |
          git add -- frontend/public/logo-192.png
          if git diff --cached --quiet; then
            echo "PWA PNG is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets(pwa): sync 192px PNG from logo-big.png [skip ci]"
          git push origin HEAD:main
