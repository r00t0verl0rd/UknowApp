name: Project checks

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.yml"
      - ".stylelintrc.json"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.yml"
      - ".stylelintrc.json"
      - ".github/workflows/frontend.yml"

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Install browser test runtime
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run realtime browser integration tests
        run: npm run test:browser
      - name: Lint shared styles
        run: npx --yes stylelint@16 'src/shared/styles/*.css' --config ../.stylelintrc.json
      - name: Audit CSS selectors against React sources
        run: node scripts/audit-css.mjs

  migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install migration test browser
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Transfer a full archive between fresh Compose projects
        run: bash frontend/tests/migrate-compose.sh

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install ruff vulture bandit detect-secrets pytest httpx
      - run: ruff check app
      - run: ruff check app --select BLE001,SIM115,B008
      - run: vulture app --min-confidence 80
      - run: bandit -r . -ll
      - name: Block newly introduced secrets
        run: git ls-files -z -- ':!.secrets.baseline' | xargs -0 detect-secrets-hook --baseline .secrets.baseline
        working-directory: .
      - run: python -m pytest -q tests
      - run: python -m compileall -q app
      - run: python -c "from app.main import app; assert app.title == 'UknowApp API'"
