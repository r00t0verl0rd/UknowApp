name: Project checks

# Only the newest run for a branch matters; never cancel a different PR or main.
concurrency:
  group: project-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/database-ci.yml"
      - ".stylelintrc.json"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/database-ci.yml"
      - ".stylelintrc.json"
      - ".github/workflows/frontend.yml"

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Lint shared styles
        run: npx --yes stylelint@16 'src/shared/styles/*.scss' --config ../.stylelintrc.json
      - name: Audit CSS selectors against SolidJS sources
        run: node scripts/audit-css.mjs

  frontend-browser:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Serve the compiled app in browser tests instead of transforming modules on every request.
      - run: npm run build
      - name: Install browser test runtime
        run: npm install --no-save playwright@1.56.1
      - name: Restore cached Chromium headless shell
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-headless-shell-1.56.1-${{ runner.os }}
      - name: Install Chromium headless shell on cache miss
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      - name: Run UI and realtime browser integration tests
        run: npm run test:browser

  backup-function:
    name: backup-function
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/requirements.txt
      - name: Install backup test dependencies
        run: uv pip install --system -r requirements.txt pytest httpx
      - name: Verify backup export, restore and rollback
        run: python -m pytest -q tests/test_admin_data_backup.py tests/test_restore_startup.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/requirements.txt
      - run: uv pip install --system -r requirements.txt ruff vulture bandit detect-secrets pytest httpx
      - run: ruff check app --extend-select BLE001,SIM115,B008
      - run: vulture app --min-confidence 80
      - run: bandit -r . -ll
      - name: Block newly introduced secrets
        run: git ls-files -z -- ':!.secrets.baseline' | xargs -0 detect-secrets-hook --baseline .secrets.baseline
        working-directory: .
      # Backup tests run once in the dedicated backup-function job.
      - run: python -m pytest -q tests --ignore=tests/test_admin_data_backup.py --ignore=tests/test_restore_startup.py
      - run: python -m compileall -q app
