name: Project checks

# Only the newest run for a branch matters; never cancel a different PR or main.
concurrency:
  group: project-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_call:
  pull_request:
  push:
    branches: [main, test]

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Lint shared styles
        run: npx --yes stylelint@16 'src/shared/styles/*.scss' --config ../.stylelintrc.json
      - name: Audit CSS selectors against SolidJS sources
        run: node scripts/audit-css.mjs

  backup-function:
    name: backup-function
    runs-on: ubuntu-latest
    env:
      ADMIN_PASSWORD: ci-only-admin-password-123 # pragma: allowlist secret
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/requirements.txt
      - name: Install backup test dependencies
        run: uv pip install --system -r requirements.txt pytest httpx httpx2
      - name: Verify backup export, restore and rollback
        run: python -m pytest -q tests/test_admin_data_backup.py tests/test_restore_startup.py

  backend:
    runs-on: ubuntu-latest
    env:
      ADMIN_PASSWORD: ci-only-admin-password-123 # pragma: allowlist secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/requirements.txt
      - run: uv pip install --system -r requirements.txt ruff vulture bandit detect-secrets pytest httpx httpx2
        id: backend_dependencies
      - run: ruff check app --extend-select BLE001,SIM115,B008
      - run: vulture app --min-confidence 80
        if: ${{ !cancelled() && steps.backend_dependencies.outcome == 'success' }}
      - run: bandit -r . -ll
        if: ${{ !cancelled() && steps.backend_dependencies.outcome == 'success' }}
      - name: Block newly introduced secrets
        if: ${{ !cancelled() && steps.backend_dependencies.outcome == 'success' }}
        run: git ls-files -z -- ':!.secrets.baseline' | xargs -0 detect-secrets-hook --baseline .secrets.baseline
        working-directory: .
      # Backup and database-specific suites have dedicated workflows; do not run them twice.
      - run: python -m pytest -q --durations=10 tests --ignore=tests/test_admin_data_backup.py --ignore=tests/test_restore_startup.py --ignore=tests/test_database_storage_info.py --ignore=tests/test_admin_stats.py --ignore=tests/test_database_dialects.py --ignore=tests/test_legacy_database_upgrade.py
        if: ${{ !cancelled() && steps.backend_dependencies.outcome == 'success' }}
      - run: python -m compileall -q app
        if: ${{ !cancelled() && steps.backend_dependencies.outcome == 'success' }}
