name: Project checks

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".stylelintrc.json"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".stylelintrc.json"
      - ".github/workflows/frontend.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Lint design tokens
        run: npx --yes stylelint@16 src/tokens.css --config ../.stylelintrc.json

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install ruff vulture bandit detect-secrets pytest httpx
      - run: ruff check app
      - run: ruff check app --select BLE001,SIM115,B008
      - run: vulture app --min-confidence 80
      - run: bandit -r . -ll
      - name: Block newly introduced secrets
        run: detect-secrets-hook --baseline .secrets.baseline
        working-directory: .
      - run: python -m pytest -q tests
      - run: python -m compileall -q app
      - run: python -c "from app.main import app; assert app.title == 'UknowApp API'"
