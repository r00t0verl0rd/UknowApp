name: Frontend checks

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".stylelintrc.json"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".stylelintrc.json"
      - ".github/workflows/frontend.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Lint design tokens
        run: npx --yes stylelint@16 src/tokens.css --config ../.stylelintrc.json
