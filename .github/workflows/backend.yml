name: Backend and Telegram tests

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
      - 'docker-compose.telegram.yml'
      - 'deploy/telegram/**'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest httpx
      - name: Compile backend
        run: python -m compileall -q backend/app backend/tests
      - name: Run regression suite (no network credentials)
        env:
          PYTHONPATH: backend
          TELEGRAM_BOT_ENABLED: 'false'
          ADMIN_PASSWORD: 'ci-placeholder-only-not-a-real-secret' # pragma: allowlist secret
          DATABASE_URL: 'sqlite://'
        run: pytest -q backend/tests
