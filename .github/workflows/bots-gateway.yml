name: NATS Gateway checks
on:
  push:
    branches: [test]
  pull_request:
    paths:
      - "backend/**"
      - "connectors/**"
      - "infrastructure/nats/**"
      - "docker-compose.yml"
      - "compose*.yml"
      - ".github/workflows/bots-gateway.yml"
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend:.
      BOTS_PLATFORMS: ""
      ADMIN_PASSWORD: ci-only-admin-password-123 # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt pytest httpx
      - run: python -m compileall -q backend/app connectors
      - name: Verify Core does not require aiogram
        run: python -c "import importlib.util; assert importlib.util.find_spec('aiogram') is None; from app.main import app"
      - run: python -m pytest -q backend/tests
      - run: pip install -r connectors/telegram/requirements.txt
      - run: python -m pytest -q connectors/tests
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Frontend unit tests and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm test
      - name: Validate and build Compose configuration
        run: |
          cp .env.example .env
          docker compose --profile gateway --profile bots config --quiet
          docker compose --profile gateway --profile bots build backend tgbot
      - name: Exercise authenticated NATS RPC and JetStream
        env:
          BOTS_NATS_CORE_PASSWORD: ci-core-password-12345678901234567890 # pragma: allowlist secret
          BOTS_NATS_TELEGRAM_PASSWORD: ci-connector-password-12345678901234567890 # pragma: allowlist secret
          BOTS_MEDIA_SECRET_TELEGRAM: ci-media-secret-12345678901234567890 # pragma: allowlist secret
        run: |
          docker run -d --rm --name gateway-ci -p 127.0.0.1:4222:4222 \
            -e CORE_PASSWORD="$BOTS_NATS_CORE_PASSWORD" -e TELEGRAM_PASSWORD="$BOTS_NATS_TELEGRAM_PASSWORD" \
            -v "$PWD/infrastructure/nats/nats.conf:/etc/nats/nats.conf:ro" nats:2.11-alpine -c /etc/nats/nats.conf
          trap 'docker logs gateway-ci; docker rm -f gateway-ci' EXIT
          BOTS_PLATFORMS=telegram BOTS_NATS_URL=nats://127.0.0.1:4222 BOTS_NATS_USER=core BOTS_NATS_PASSWORD="$BOTS_NATS_CORE_PASSWORD" python backend/tests/nats_smoke.py
