name: Обновление иконок приложения

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/public/logo.png"
      - "frontend/scripts/generate_icons.py"
      - ".github/workflows/generate-icons.yml"

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Создать значки из оригинального логотипа
        run: |
          python -m pip install "Pillow>=10,<13"
          python frontend/scripts/generate_icons.py
      - name: Сохранить готовые файлы в main
        run: |
          git add -- frontend/public/favicon.ico \
            frontend/public/safari-pinned-tab.svg \
            frontend/public/favicon-16x16.png \
            frontend/public/favicon-32x32.png \
            frontend/public/icon-192.png \
            frontend/public/icon-512.png \
            frontend/public/icon-maskable-512.png \
            frontend/public/mstile-150x150.png
          if git diff --cached --quiet; then
            echo "Значки уже актуальны."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets(icons): update Firefox, Android and Windows images [skip ci]"
          git push origin HEAD:main
