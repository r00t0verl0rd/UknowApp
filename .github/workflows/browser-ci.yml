name: Browser integration

on:
  workflow_call:
  pull_request:
  push:
    branches: [main, test]
    paths:
      - "frontend/**"
      - "backend/app/**"
      - "docker-compose.yml"
      - "compose*.yml"
      - ".github/workflows/browser-ci.yml"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

concurrency:
  group: browser-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-browser:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Serve the compiled app in browser tests instead of transforming modules on every request.
      - run: npm run build
      - name: Install browser test runtime
        run: npm install --no-save playwright@1.56.1
      - name: Restore cached Chromium headless shell
        id: browser-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: chromium-headless-shell-1.56.1-${{ runner.os }}
      - name: Install Chromium headless shell on cache miss
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      - name: Run UI and realtime browser integration tests
        run: npm run test:browser
