name: SQLite mixed workload 90-10 versus 50-50
on:
  push:
    branches: [benchmark/sqlite-50-50]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mixed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        write_percent: [10, 50]
    env:
      PYTHONPATH: backend:.
      ADMIN_PASSWORD: isolated-ci-benchmark-only-123 # pragma: allowlist secret
      BOTS_PLATFORMS: ""
      UKNOWAPP_SQLITE_CHAT_READ_CONCURRENCY: "4"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - run: uv pip install --system -r backend/requirements.txt httpx
      - name: Record environment
        run: |
          nproc
          free -m
      - name: Mixed read and send workload
        run: python backend/tests/benchmark_mixed_chat.py --messages 1000000 --clients 100 250 500 1000 2000 --rounds 2 --mixed-only --write-percent ${{ matrix.write_percent }} --output mixed-${{ matrix.write_percent }}.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mixed-${{ matrix.write_percent }}
          path: mixed-${{ matrix.write_percent }}.json
