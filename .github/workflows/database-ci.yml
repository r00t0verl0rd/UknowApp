name: Database compatibility

on:
  push:
    branches: [test]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/database-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/database-ci.yml"

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt pytest httpx httpx2
      - name: Canonical startup migrations on temporary SQLite
        env:
          PYTHONPATH: backend
          DATABASE_URL: sqlite:///./ci-test.sqlite3
          ADMIN_PASSWORD: ci-only-admin-password-123 # pragma: allowlist secret
        run: |
          python -c 'from app.migrations import initialize_database; initialize_database(); initialize_database()'
          pytest -q backend/tests/test_database_storage_info.py backend/tests/test_admin_stats.py backend/tests/test_database_dialects.py backend/tests/test_legacy_database_upgrade.py

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: uknowapp_ci
          POSTGRES_USER: uknowapp_ci
          POSTGRES_PASSWORD: ci-only-db-password # pragma: allowlist secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U uknowapp_ci -d uknowapp_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt pytest httpx httpx2
      - name: Canonical startup migrations on temporary PostgreSQL
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql+psycopg://uknowapp_ci:ci-only-db-password@127.0.0.1:5432/uknowapp_ci # pragma: allowlist secret
          UKNOWAPP_MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://uknowapp_ci:ci-only-db-password@127.0.0.1:5432/uknowapp_ci # pragma: allowlist secret
          ADMIN_PASSWORD: ci-only-admin-password-123 # pragma: allowlist secret
        run: |
          python -c 'from app.migrations import initialize_database; initialize_database(); initialize_database()'
          pytest -q backend/tests/test_database_storage_info.py backend/tests/test_database_dialects.py backend/tests/test_legacy_database_upgrade.py
