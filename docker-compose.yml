services:
  telegram-bot-api:
    extends:
      file: compose.telegram.yml
      service: telegram-bot-api
    profiles: [telegram]
    networks: [app_net]

  core:
    container_name: uknow-core
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-now}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      DOMAIN: ${DOMAIN:-localhost}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      PUSH_MESSAGE_PREVIEW_ENABLED: ${PUSH_MESSAGE_PREVIEW_ENABLED:-false}
      BOTS_PLATFORMS: ${BOTS_PLATFORMS:-}
      TELEGRAM_API_MODE: ${TELEGRAM_API_MODE:-cloud}
      BOTS_NATS_URL: nats://nats:4222
      BOTS_NATS_USER: core
      BOTS_NATS_PASSWORD: ${BOTS_NATS_CORE_PASSWORD:-}
      BOTS_MEDIA_SECRET_TELEGRAM: ${BOTS_MEDIA_SECRET_TELEGRAM:-}
      BOTS_MEDIA_SECRET_MAX: ${BOTS_MEDIA_SECRET_MAX:-}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/uknowapp.db}
      UKNOWAPP_SQLITE_CHAT_READ_CONCURRENCY: ${UKNOWAPP_SQLITE_CHAT_READ_CONCURRENCY:-4}
      UKNOWAPP_SQLITE_POOL_SIZE: ${UKNOWAPP_SQLITE_POOL_SIZE:-5}
      UKNOWAPP_SQLITE_POOL_OVERFLOW: ${UKNOWAPP_SQLITE_POOL_OVERFLOW:-10}
      PYTHONPATH: /app/backend
      TMPDIR: /app/data
      UKNOWAPP_AUTO_RESTART_ON_RESTORE: "true"
      TRUSTED_PROXY_IPS: 127.0.0.1,::1,${UKNOWAPP_CADDY_IP:-172.31.255.2}
      FORWARDED_ALLOW_IPS: ${UKNOWAPP_CADDY_IP:-172.31.255.2}
    networks:
      app_net:
        aliases: [backend]
        ipv4_address: ${UKNOWAPP_BACKEND_IP:-172.31.255.3}
    volumes:
      - app_data:/app/data
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).read()"
      # Быстро обнаруживаем отказ, сохраняя прежний порог повторных ошибок.
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 20s
    # Один Core управляет outbox и SSE.

  nats:
    container_name: uknow-nats
    image: nats:2.11-alpine
    profiles: [gateway]
    entrypoint: ["/bin/sh", "/usr/local/bin/nats-start.sh"]
    environment:
      CORE_PASSWORD: ${BOTS_NATS_CORE_PASSWORD:-}
      TELEGRAM_PASSWORD: ${BOTS_NATS_TELEGRAM_PASSWORD:-}
      MAX_PASSWORD: ${BOTS_NATS_MAX_PASSWORD:-}
    volumes:
      - ./infrastructure/nats/nats.conf:/etc/nats/nats.conf:ro
      - ./infrastructure/nats/nats-max.conf:/etc/nats/nats-max.conf:ro
      - ./infrastructure/nats/nats-start.sh:/usr/local/bin/nats-start.sh:ro
      - nats_data:/data
    networks: [app_net]
    restart: unless-stopped

  # Коннекторы запускаются по запросу.
  tg_bot:
    container_name: uknow-tgbot
    profiles: [bots]
    build:
      context: .
      dockerfile: connectors/telegram/Dockerfile
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_API_MODE: ${TELEGRAM_API_MODE:-cloud}
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-http://telegram-bot-api:8081}
      TELEGRAM_FILES_DIR: /var/lib/telegram-bot-api
      BOTS_NATS_URL: nats://nats:4222
      BOTS_NATS_USER: telegram
      BOTS_NATS_PASSWORD: ${BOTS_NATS_TELEGRAM_PASSWORD:-}
      BOTS_MEDIA_URL: http://core:8000
      BOTS_MEDIA_SECRET: ${BOTS_MEDIA_SECRET_TELEGRAM:-}
    volumes:
      - tgbot_state:/app/state
      - ${TELEGRAM_CACHE_HOST_DIR:-/srv/uknow-telegram}:/var/lib/telegram-bot-api:ro
    networks: [app_net]
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time; p=pathlib.Path('/app/state/healthy'); assert p.is_file() and time.time()-p.stat().st_mtime < 75"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  max_bot:
    container_name: uknow-maxbot
    profiles: [max]
    build:
      context: .
      dockerfile: connectors/max/Dockerfile
    environment:
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      MAX_WEBHOOK_URL: https://${DOMAIN:-localhost}/hooks/max
      BOTS_NATS_URL: nats://nats:4222
      BOTS_NATS_USER: max
      BOTS_NATS_PASSWORD: ${BOTS_NATS_MAX_PASSWORD:-}
      BOTS_MEDIA_URL: http://core:8000
      BOTS_MEDIA_SECRET: ${BOTS_MEDIA_SECRET_MAX:-}
    volumes:
      - maxbot_state:/app/state
    networks:
      app_net:
        aliases: [maxbot]
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time; p=pathlib.Path('/app/state/healthy'); assert p.is_file() and time.time()-p.stat().st_mtime < 75"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    profiles: [postgres]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uknowapp}
      POSTGRES_USER: ${POSTGRES_USER:-uknowapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  web_panel:
    container_name: uknow-webpanel
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      core:
        condition: service_healthy
    networks:
      app_net:
        ipv4_address: ${UKNOWAPP_CADDY_IP:-172.31.255.2}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:2019/config/
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  app_net:
    ipam:
      config:
        # Динамические IP не пересекаются с адресами Caddy и Core.
        - subnet: ${UKNOWAPP_DOCKER_SUBNET:-172.31.255.0/24}
          ip_range: ${UKNOWAPP_DOCKER_IP_RANGE:-172.31.255.128/25}

volumes:
  app_data:
  caddy_data:
  caddy_config:
  postgres_data:
  tgbot_state:
  maxbot_state:
  nats_data:
